    .animate-fade-in-up { animation: fadeInUp 0.6s ease-out forwards; }
    @keyframes bounceIn { 0% { transform: scale(0.1); opacity: 0; } 60% { transform: scale(1.2); opacity: 1; } 100% { transform: scale(1); opacity: 1; } }
    .animate-bounce-in { animation: bounceIn 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards; }
    * { -webkit-tap-highlight-color: transparent; }
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    
    .font-note { font-family: 'Andika', sans-serif; font-size: 38px; letter-spacing: 0.05em; }

    .custom-scrollbar::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 8px; }
    .custom-scrollbar::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
    
    .shake-animation { animation: shake 0.5s; }
    @keyframes shake {
      0% { transform: translate(1px, 1px) rotate(0deg); }
      10% { transform: translate(-1px, -2px) rotate(-1deg); }
      20% { transform: translate(-3px, 0px) rotate(1deg); }
      30% { transform: translate(3px, 2px) rotate(0deg); }
      40% { transform: translate(1px, -1px) rotate(1deg); }
      50% { transform: translate(-1px, 2px) rotate(-1deg); }
      60% { transform: translate(-3px, 1px) rotate(0deg); }
      70% { transform: translate(3px, 1px) rotate(-1deg); }
      80% { transform: translate(-1px, -1px) rotate(1deg); }
      90% { transform: translate(1px, 2px) rotate(0deg); }
      100% { transform: translate(1px, -2px) rotate(-1deg); }
    }

    // 50〜950までの50の倍数

    // 音声認識用：英語の数字表記を算用数字に正規化
    const normalizeSpeechText = (str) => {
      let s = str.toLowerCase().replace(/it's/g, 'its');
      const map = [
        ['nine hundred fifty', '950'], ['nine hundred and fifty', '950'], ['nine hundred', '900'],
        ['eight hundred fifty', '850'], ['eight hundred and fifty', '850'], ['eight hundred', '800'],
        ['seven hundred fifty', '750'], ['seven hundred and fifty', '750'], ['seven hundred', '700'],
        ['six hundred fifty', '650'], ['six hundred and fifty', '650'], ['six hundred', '600'],
        ['five hundred fifty', '550'], ['five hundred and fifty', '550'], ['five hundred', '500'],
        ['four hundred fifty', '450'], ['four hundred and fifty', '450'], ['four hundred', '400'],
        ['three hundred fifty', '350'], ['three hundred and fifty', '350'], ['three hundred', '300'],
        ['two hundred fifty', '250'], ['two hundred and fifty', '250'], ['two hundred', '200'],
        ['one hundred fifty', '150'], ['one hundred and fifty', '150'], ['one hundred', '100'],
        ['a hundred fifty', '150'], ['a hundred', '100'], ['fifty', '50']
      ];
      map.forEach(([word, num]) => {
        s = s.replace(new RegExp(word, 'g'), num);
      });
      return s.replace(/[^a-z0-9\s]/g, '').replace(/\s+/g, ' ').trim();
    };

    const INNUUNI_STAGES = {

    const SALMON_TYPES = {

      silver: { id: 'silver', name: '銀のシャケ', exp: 3, emoji: '🤍🐟' },

    const GAS_URLS = [
      "https://script.google.com/macros/s/AKfycbweESd0ikrHJl6Pl5lPnniXgoUWW45_YDUIAXuCBYKkclBs3T47GX83B5q-GAc8Hw3sPQ/exec",

      "https://script.google.com/macros/s/AKfycbz6Jeiu5yDwBOwWpAIicyXdWqtaT-qT7KjP59DU3b7IkP3eDucpggHW1Fxrm2xBbsQL/exec"
    ];

    const INITIAL_INPUTS = [
      { type: 'food1', label: '１つめの食べ物', example: 'すし', action: '', price: '' },
      { type: 'food2', label: '２つめの食べ物', example: 'たこ焼き', action: '', price: '' },
      { type: 'food3', label: '３つめの食べ物', example: 'ラーメン', action: '', price: '' }
    ];

    const createEmojiSprite = (emoji, size = 64) => {
      const canvas = document.createElement('canvas');
      canvas.width = size * 2; canvas.height = size * 2;
      const ctx = canvas.getContext('2d');
      ctx.font = `${size}px Arial`;
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText(emoji, size, size);
      const tex = new THREE.CanvasTexture(canvas);
      const spriteMat = new THREE.SpriteMaterial({ map: tex, transparent: true });
      return new THREE.Sprite(spriteMat);
    };

    const ThreeCoinGame = ({ playerEmoji, helpers, onFinish }) => {
      const mountRef = useRef(null);
      const [timeLeft, setTimeLeft] = useState(15);
      const [score, setScore] = useState(0);
      const gameData = useRef({
        playerSprite: null, coins: [], enemies: [], helperSprites: [], isPlaying: true, score: 0, frozenFrames: 0, keys: {}
      });

      useEffect(() => {
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x87CEEB); 
        
        const w = mountRef.current ? mountRef.current.clientWidth || window.innerWidth : window.innerWidth;
        const h = mountRef.current ? mountRef.current.clientHeight || (window.innerHeight * 0.6) : (window.innerHeight * 0.6);
        
        const camera = new THREE.PerspectiveCamera(50, w / h, 0.1, 1000);
        camera.position.set(0, 60, 0);
        camera.up.set(0, 0, -1);
        camera.lookAt(0, 0, 0);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(w, h);
        if (mountRef.current) mountRef.current.appendChild(renderer.domElement);

        const vFov = camera.fov * Math.PI / 180;
        const zRange = 2 * Math.tan(vFov / 2) * camera.position.y;
        const xRange = zRange * camera.aspect;
        const safeX = Math.max(10, (xRange / 2) * 0.9);
        const safeZ = Math.max(10, (zRange / 2) * 0.9);

        const planeGeo = new THREE.PlaneGeometry(150, 150);
        const planeMat = new THREE.MeshLambertMaterial({ color: 0x2d8a4e });
        const plane = new THREE.Mesh(planeGeo, planeMat);
        plane.rotation.x = -Math.PI / 2;
        scene.add(plane);

        for (let i = 0; i < 40; i++) {
          const tree = createEmojiSprite(Math.random() > 0.5 ? '🌲' : '🌳', 96);
          tree.scale.set(8, 8, 1);
          const tx = (Math.random() - 0.5) * 120;
          const tz = (Math.random() - 0.5) * 120;
          if (Math.abs(tx) > safeX - 2 || Math.abs(tz) > safeZ - 2) {
            tree.position.set(tx, 4, tz);
            scene.add(tree);
          }
        }

        const grid = new THREE.GridHelper(100, 50, 0x1a4a2b, 0x1a4a2b);
        grid.material.opacity = 0.5;
        grid.material.transparent = true;
        scene.add(grid);

        const ambientLight = new THREE.AmbientLight(0xffffff, 1.0);
        scene.add(ambientLight);
        const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
        dirLight.position.set(10, 20, 10);
        scene.add(dirLight);

        const playerSprite = createEmojiSprite(playerEmoji, 96);
        playerSprite.scale.set(5, 5, 1);
        playerSprite.position.y = 2.5;
        scene.add(playerSprite);
        gameData.current.playerSprite = playerSprite;

        const spawnCoin = () => {
          const coin = createEmojiSprite('🪙', 64);
          coin.scale.set(4, 4, 1);
          coin.position.set((Math.random() - 0.5) * safeX * 2, 1.5, (Math.random() - 0.5) * safeZ * 2);
          scene.add(coin);
          gameData.current.coins.push(coin);
        };
        for(let i=0; i<12; i++) spawnCoin();

        const spawnEnemy = () => {
          const enemy = createEmojiSprite('👾', 64);
          enemy.scale.set(4, 4, 1);
          enemy.position.set((Math.random() - 0.5) * safeX * 2, 2, (Math.random() - 0.5) * safeZ * 2);
          enemy.userData = { dx: (Math.random() - 0.5) * 0.6, dz: (Math.random() - 0.5) * 0.6 };
          scene.add(enemy);
          gameData.current.enemies.push(enemy);
        };
        for(let i=0; i<8; i++) spawnEnemy();

        if (helpers && helpers.length > 0) {
          helpers.forEach(h => {
            const helperSprite = createEmojiSprite(h.emoji, 64);
            helperSprite.scale.set(3.5, 3.5, 1);
            helperSprite.position.set((Math.random() - 0.5) * safeX * 2, 2, (Math.random() - 0.5) * safeZ * 2);
            helperSprite.userData = { dx: (Math.random() - 0.5) * 0.5, dz: (Math.random() - 0.5) * 0.5 };
            scene.add(helperSprite);
            gameData.current.helperSprites.push(helperSprite);
          });
        }

        const handleKeyDown = (e) => { gameData.current.keys[e.key] = true; };
        const handleKeyUp = (e) => { gameData.current.keys[e.key] = false; };
        window.addEventListener('keydown', handleKeyDown);
        window.addEventListener('keyup', handleKeyUp);

        let animationId;
        const timerId = setInterval(() => {
          setTimeLeft(prev => {
            if (prev <= 1) {
              clearInterval(timerId);
              gameData.current.isPlaying = false;
              return 0;
            }
            return prev - 1;
          });
        }, 1000);

        const animate = () => {
          if (!gameData.current.isPlaying) return;
          animationId = requestAnimationFrame(animate);

          const { playerSprite, coins, enemies, helperSprites, keys } = gameData.current;

          if (gameData.current.frozenFrames > 0) {
            gameData.current.frozenFrames--;
            playerSprite.material.opacity = Math.floor(gameData.current.frozenFrames / 10) % 2 === 0 ? 0.3 : 1.0;
          } else {
            playerSprite.material.opacity = 1.0;
            let dx = 0, dz = 0;
            const speed = 0.6;
            if (keys['ArrowUp'] || keys['w']) dz -= speed;
            if (keys['ArrowDown'] || keys['s']) dz += speed;
            if (keys['ArrowLeft'] || keys['a']) dx -= speed;
            if (keys['ArrowRight'] || keys['d']) dx += speed;
            playerSprite.position.x += dx;
            playerSprite.position.z += dz;
            
            playerSprite.position.x = Math.max(-safeX, Math.min(safeX, playerSprite.position.x));
            playerSprite.position.z = Math.max(-safeZ, Math.min(safeZ, playerSprite.position.z));
          }

          for (let i = coins.length - 1; i >= 0; i--) {
            const c = coins[i];
            if (playerSprite.position.distanceTo(c.position) < 4.0) {
              scene.remove(c);
              coins.splice(i, 1);
              gameData.current.score++;
              setScore(gameData.current.score);
              spawnCoin();
            }
          }

          enemies.forEach(e => {
            e.position.x += e.userData.dx;
            e.position.z += e.userData.dz;
            if (e.position.x > safeX || e.position.x < -safeX) e.userData.dx *= -1;
            if (e.position.z > safeZ || e.position.z < -safeZ) e.userData.dz *= -1;
            
            if (gameData.current.frozenFrames === 0 && playerSprite.position.distanceTo(e.position) < 3.5) {
              gameData.current.frozenFrames = 60;
              if (mountRef.current) {
                mountRef.current.parentElement.classList.add('shake-animation');
                setTimeout(() => {
                  if(mountRef.current && mountRef.current.parentElement) mountRef.current.parentElement.classList.remove('shake-animation');
                }, 500);
              }
            }
          });

          helperSprites.forEach(h => {
            let closestEnemy = null;
            let minDist = Infinity;
            enemies.forEach(e => {
              const d = h.position.distanceTo(e.position);
              if (d < minDist) {
                minDist = d;
                closestEnemy = e;
              }
            });

            if (closestEnemy) {
              const dx = closestEnemy.position.x - h.position.x;
              const dz = closestEnemy.position.z - h.position.z;
              const dist = Math.sqrt(dx * dx + dz * dz);
              if (dist > 0) {
                h.userData.dx = (dx / dist) * 0.7;
                h.userData.dz = (dz / dist) * 0.7;
              }
            }

            h.position.x += h.userData.dx;
            h.position.z += h.userData.dz;
            if (h.position.x > safeX) { h.position.x = safeX; h.userData.dx *= -1; }
            if (h.position.x < -safeX) { h.position.x = -safeX; h.userData.dx *= -1; }
            if (h.position.z > safeZ) { h.position.z = safeZ; h.userData.dz *= -1; }
            if (h.position.z < -safeZ) { h.position.z = -safeZ; h.userData.dz *= -1; }

            enemies.forEach(e => {
              if (h.position.distanceTo(e.position) < 4.0) {
                e.position.set((Math.random() - 0.5) * safeX * 2, 2, (Math.random() - 0.5) * safeZ * 2);
              }
            });
          });

          renderer.render(scene, camera);
        };
        animate();

        return () => {
          window.removeEventListener('keydown', handleKeyDown);
          window.removeEventListener('keyup', handleKeyUp);
          clearInterval(timerId);
          cancelAnimationFrame(animationId);
          if (mountRef.current && renderer.domElement) {
            mountRef.current.removeChild(renderer.domElement);
          }
        };
      }, []);

      useEffect(() => {
        if (timeLeft === 0) onFinish(gameData.current.score);
      }, [timeLeft, onFinish]);

      const handleBtn = (key, isDown) => { gameData.current.keys[key] = isDown; };

      return (
        <div className="flex flex-col items-center bg-gray-900 w-full h-full touch-none relative">
          <div className="absolute top-4 left-0 right-0 flex justify-between px-6 z-10 pointer-events-none">
            <div className="text-2xl font-bold text-white bg-gray-800/80 px-6 py-2 rounded-full border-2 border-gray-600 backdrop-blur">⏳ {timeLeft}</div>
            <div className="text-2xl font-bold text-yellow-400 bg-gray-800/80 px-6 py-2 rounded-full border-2 border-gray-600 backdrop-blur">🪙 {score}</div>
          </div>
          <div className="flex-1 w-full overflow-hidden flex items-center justify-center bg-sky-200" ref={mountRef}></div>
          <div className="h-48 w-full bg-gray-800 border-t-4 border-gray-700 flex items-center justify-center shrink-0">
            <div className="grid grid-cols-3 gap-4 w-full max-w-[300px]">
              <div />
              <button onPointerDown={() => handleBtn('ArrowUp', true)} onPointerUp={() => handleBtn('ArrowUp', false)} onPointerLeave={() => handleBtn('ArrowUp', false)} className="bg-gray-600 text-white p-6 rounded-2xl text-4xl active:bg-blue-500 flex items-center justify-center shadow-lg">⬆️</button>
              <div />
              <button onPointerDown={() => handleBtn('ArrowLeft', true)} onPointerUp={() => handleBtn('ArrowLeft', false)} onPointerLeave={() => handleBtn('ArrowLeft', false)} className="bg-gray-600 text-white p-6 rounded-2xl text-4xl active:bg-blue-500 flex items-center justify-center shadow-lg">⬅️</button>
              <button onPointerDown={() => handleBtn('ArrowDown', true)} onPointerUp={() => handleBtn('ArrowDown', false)} onPointerLeave={() => handleBtn('ArrowDown', false)} className="bg-gray-600 text-white p-6 rounded-2xl text-4xl active:bg-blue-500 flex items-center justify-center shadow-lg">⬇️</button>
              <button onPointerDown={() => handleBtn('ArrowRight', true)} onPointerUp={() => handleBtn('ArrowRight', false)} onPointerLeave={() => handleBtn('ArrowRight', false)} className="bg-gray-600 text-white p-6 rounded-2xl text-4xl active:bg-blue-500 flex items-center justify-center shadow-lg">➡️</button>
            </div>
          </div>
        </div>
      );
    };

    function App() {
      const [step, setStep] = useState('HOME'); 
      const [stepHistory, setStepHistory] = useState(['HOME']);
      const [totalCoins, setTotalCoins] = useState(0);
      const [items, setItems] = useState({ normal: 0, silver: 0, gold: 0, legend: 0 });
      const [level, setLevel] = useState(1);
      const [exp, setExp] = useState(0);
      const [helpers, setHelpers] = useState([]);
      
      const [inputs, setInputs] = useState(JSON.parse(JSON.stringify(INITIAL_INPUTS)));
      const [translatingState, setTranslatingState] = useState(false);
      const [listeningIdx, setListeningIdx] = useState(null);
      
      const [savedWorks, setSavedWorks] = useState([]);
      const [createdSentences, setCreatedSentences] = useState([]); 
      const [viewingWork, setViewingWork] = useState(null);

      const [canPlayGame, setCanPlayGame] = useState(false);
      const [isFirstWork, setIsFirstWork] = useState(true);

      const [isListening, setIsListening] = useState(false);
      const [feedbackMsg, setFeedbackMsg] = useState("");
      const [slideFailCount, setSlideFailCount] = useState(0);
      const [gachaFailCount, setGachaFailCount] = useState(0);
      const [localVoiceCleared, setLocalVoiceCleared] = useState(false); 
      const [gachaState, setGachaState] = useState(null); 
      const [quizOptions, setQuizOptions] = useState([]);

      const [practiceIndex, setPracticeIndex] = useState(0);

      const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
      const synth = window.speechSynthesis;

      useEffect(() => {
        const load = (key, setter, isObj = false) => {
          const val = localStorage.getItem(key);
          if (val) setter(isObj ? JSON.parse(val) : parseInt(val, 10));
        };
        load('wTJapanCoins', setTotalCoins);
        load('wTJapanItems', setItems, true);
        load('wTJapanLevel', setLevel);
        load('wTJapanExp', setExp);
        load('wTJapanHelpers', setHelpers, true);
        load('wTJapanWorks', setSavedWorks, true);
        load('wTJapanSentences', setCreatedSentences, true);
        
        const first = localStorage.getItem('wTJapanIsFirst');
        if (first !== null) setIsFirstWork(first === 'true');
      }, []);

      const saveProgress = (newCoins, newItems, newLevel, newExp, newHelpers) => {
        localStorage.setItem('wTJapanCoins', newCoins.toString());
        localStorage.setItem('wTJapanItems', JSON.stringify(newItems));
        localStorage.setItem('wTJapanLevel', newLevel.toString());
        localStorage.setItem('wTJapanExp', newExp.toString());
        if (newHelpers) localStorage.setItem('wTJapanHelpers', JSON.stringify(newHelpers));
        
        setTotalCoins(newCoins); setItems(newItems); setLevel(newLevel); setExp(newExp);
        if (newHelpers) setHelpers(newHelpers);
      };

      const saveWork = (workData) => {
        const newWorks = [workData, ...savedWorks];
        localStorage.setItem('wTJapanWorks', JSON.stringify(newWorks));
        setSavedWorks(newWorks);
        
        const newSentences = [...createdSentences, workData.sentence];
        localStorage.setItem('wTJapanSentences', JSON.stringify(newSentences));
        setCreatedSentences(newSentences);
      };

      const updateWork = (date, updatedWork) => {
        const newWorks = savedWorks.map(w => w.date === date ? { ...w, ...updatedWork } : w);
        localStorage.setItem('wTJapanWorks', JSON.stringify(newWorks));
        setSavedWorks(newWorks);
        setViewingWork(newWorks.find(w => w.date === date));
      };

      const updateWorkGameStatus = (date) => {
        const newWorks = savedWorks.map(w => w.date === date ? { ...w, hasPlayedGame: true } : w);
        localStorage.setItem('wTJapanWorks', JSON.stringify(newWorks));
        setSavedWorks(newWorks);
        setViewingWork(newWorks.find(w => w.date === date));
      };

      const markFirstDone = () => {
        setIsFirstWork(false);
        localStorage.setItem('wTJapanIsFirst', 'false');
      };

      const speak = useCallback((text) => {
        if (synth.speaking) synth.cancel();
        const utterThis = new SpeechSynthesisUtterance(text);
        utterThis.lang = 'en-US';
        utterThis.rate = 0.9;
        synth.speak(utterThis);
      }, [synth]);

      const goToStep = (newStep) => {
        setStepHistory(prev => [...prev, newStep]);
        setStep(newStep);
        window.scrollTo(0, 0);
      };

      const goBack = () => {
        if (stepHistory.length > 1) {
          const newHistory = [...stepHistory];
          newHistory.pop();
          setStep(newHistory[newHistory.length - 1]);
          setStepHistory(newHistory);
        } else {
          setStep('HOME');
          setStepHistory(['HOME']);
        }
      };

      const startListening = (targetSentence, onSuccess, onFail) => {
        if (!SpeechRecognition) {
          setFeedbackMsg("マイクが使えません。");
          if(onFail) onFail();
          return;
        }
        const recognition = new SpeechRecognition();
        recognition.lang = 'en-US';
        setIsListening(true);
        setFeedbackMsg("");

        recognition.onresult = (event) => {
          const rawTrans = event.results[0][0].transcript;
          const trans = normalizeSpeechText(rawTrans);
          const target = normalizeSpeechText(targetSentence);
          
          const transWords = trans.split(/\s+/).filter(w => w);
          const targetWords = target.split(/\s+/).filter(w => w);
          
          let matchCount = 0;
          targetWords.forEach(tw => {
            if (transWords.includes(tw)) matchCount++;
          });
          const matchRate = targetWords.length > 0 ? (matchCount / targetWords.length) : 0;
          
          if (matchRate >= 0.5 || trans === target) {
            setFeedbackMsg("Excellent! 👏");
            setTimeout(() => { setFeedbackMsg(""); onSuccess(); }, 1500);
          } else {
            setFeedbackMsg(`おしい！\n(${rawTrans} と聞こえました)`);
            if(onFail) onFail();
          }
        };
        recognition.onerror = () => { setFeedbackMsg("エラーがおきました。もう一度押してね。"); setIsListening(false); if(onFail) onFail(); };
        recognition.onend = () => setIsListening(false);
        recognition.start();
      };

      const handleTranslateAll = async () => {
        let f1 = inputs[0].action.trim();
        let f2 = inputs[1].action.trim();
        let f3 = inputs[2].action.trim();
        let p1 = inputs[0].price;
        let p2 = inputs[1].price;
        let p3 = inputs[2].price;
        
        if (!f1 || !f2 || !f3 || !p1 || !p2 || !p3) return;

        if (f1 === f2 || f1 === f3 || f2 === f3) {
          alert("２つ以上同じ食べ物にすることはできません。ちがう食べ物をえらんでね！");
          return;
        }

        setTranslatingState(true);
        
        let enF1 = DIC[f1] || f1;
        let enF2 = DIC[f2] || f2;
        let enF3 = DIC[f3] || f3;

        try {
          const fetchTranslation = async (text) => {
            try {
              const res = await fetch(`${GAS_URLS[0]}?text=${encodeURIComponent(text)}`).then(r=>r.json());
              return res.text ? res.text.toLowerCase() : text;
            } catch (err) {
              return text;
            }
          };

          if (!DIC[f1]) enF1 = await fetchTranslation(f1);
          if (!DIC[f2]) enF2 = await fetchTranslation(f2);
          if (!DIC[f3]) enF3 = await fetchTranslation(f3);
        } catch (e) {
          console.warn("Translation API error", e);
        }

        const menuItems = [
          { ja: f1, en: enF1, price: p1, sentence: `It's ${p1} yen.` },
          { ja: f2, en: enF2, price: p2, sentence: `It's ${p2} yen.` },
          { ja: f3, en: enF3, price: p3, sentence: `It's ${p3} yen.` }
        ];
        
        let finalSentence = menuItems.map(m => `${m.en}: ${m.sentence}`).join(' / ');

        setTranslatingState(false);
        
        const isDuplicate = createdSentences.some(s => s.toLowerCase() === finalSentence.toLowerCase());
        if (isDuplicate) {
          alert("その組み合わせはもう作ったことがあるよ！ちがう食べ物やねだんにしてみよう。");
          return;
        }

        const newWork = { 
          date: new Date().toLocaleString(), 
          sentence: finalSentence, 
          menuItems: menuItems,
          img1: "", img2: "", img3: "", 
          inputs: inputs, 
          hasPlayedGame: false 
        };
        setViewingWork(newWork);
        
        goToStep('NOTE_WRITE');
      };

      const rollGacha = (isBonus, hasNextBonus = false, currentCoins) => {
        const rand = Math.random();
        let itemKey = 'normal';
        if (isBonus) {
          if (rand < 0.1) itemKey = 'legend';
          else if (rand < 0.5) itemKey = 'gold';
          else itemKey = 'silver';
        } else {
          if (rand < 0.05) itemKey = 'gold';
          else if (rand < 0.2) itemKey = 'silver';
          else itemKey = 'normal';
        }
        const item = SALMON_TYPES[itemKey];
        const newItems = { ...items, [itemKey]: items[itemKey] + 1 };
        
        const coinsToSave = currentCoins !== undefined ? currentCoins : totalCoins;
        saveProgress(coinsToSave, newItems, level, exp, helpers);
        
        setGachaState({ phase: 'result', item, hasNextBonus });
      };

      const startGacha = () => {
        if (totalCoins < 5) return;
        const nextCoins = totalCoins - 5;
        setGachaFailCount(0);
        
        const targetWord = QUIZ_WORDS[Math.floor(Math.random() * QUIZ_WORDS.length)];
        let options = [targetWord];
        while(options.length < 4) {
          const w = QUIZ_WORDS[Math.floor(Math.random() * QUIZ_WORDS.length)];
          if(!options.find(o => o.en === w.en)) options.push(w);
        }
        options = options.sort(() => Math.random() - 0.5);
        
        setQuizOptions(options);
        gachaTargetRef.current = targetWord; 
        
        rollGacha(false, true, nextCoins); 
      };

      const gachaTargetRef = useRef(null);

      const handleQuizAnswer = (ans) => {
        if (ans.en === gachaTargetRef.current.en) {
          setGachaState(prev => ({...prev, phase: 'voice'}));
        } else {
          setFeedbackMsg("ちがうよ！もういちど！");
          setTimeout(() => setFeedbackMsg(""), 1500);
        }
      };

      const feedInnuuni = (type) => {
        if (items[type] > 0) {
          const salmon = SALMON_TYPES[type];
          const newItems = { ...items, [type]: items[type] - 1 };
          const newExp = exp + salmon.exp;
          
          let currentStage = INNUUNI_STAGES[level];
          let nextReq = currentStage.next.length > 0 ? INNUUNI_STAGES[currentStage.next[0]].reqExp : 9999;
          let newLevel = level;
          let newHelpers = [...helpers];
          
          if (newExp >= nextReq && currentStage.next.length > 0) {
            newLevel = currentStage.next[0];
            if (!newHelpers.find(h => h.id === currentStage.id)) {
              newHelpers.push(currentStage);
            }
          }
          
          saveProgress(totalCoins, newItems, newLevel, newExp, newHelpers);
          setFeedbackMsg(`${salmon.name} をたべた！ +${salmon.exp} EXP`);
          setTimeout(() => setFeedbackMsg(""), 2000);
        }
      };

      const BackButton = () => (
        <button onClick={goBack} className="absolute top-4 left-4 bg-white/90 px-4 py-2 rounded-full shadow font-bold text-gray-700 border hover:bg-gray-100 z-20">
          ◀ もどる
        </button>
      );

      const HomeButton = () => (
        <button onClick={() => { setStep('HOME'); setStepHistory(['HOME']); }} className="absolute top-4 right-4 bg-indigo-100/90 px-4 py-2 rounded-full shadow-md font-bold text-indigo-800 border-2 border-indigo-300 hover:bg-indigo-200 z-20 transition-colors">
          🏠 ホーム
        </button>
      );

      let content = null;
      const currentStage = INNUUNI_STAGES[level] || INNUUNI_STAGES[1];
      const nextReq = currentStage.next.length > 0 ? INNUUNI_STAGES[currentStage.next[0]].reqExp : 'MAX';
      
      const isAllInputsFilled = inputs.every(inp => inp.action && inp.action.trim() !== '' && inp.price !== '');

      if (step === 'HOME') {
        content = (
          <div className="min-h-screen p-4 md:p-8 flex flex-col justify-center relative bg-indigo-50 pb-20">
            <div className="max-w-3xl w-full mx-auto bg-white rounded-3xl shadow-xl border-4 border-indigo-200 overflow-hidden">
              <div className="bg-gradient-to-r from-indigo-500 to-blue-600 p-8 text-center text-white">
                <h1 className="text-3xl md:text-4xl font-extrabold drop-shadow-md">ランチメニューの<br/><span className="text-xl md:text-2xl opacity-90 mt-2 block">ねだんを答えよう（店員さん）</span></h1>
              </div>
              <div className="p-6 text-center">
                
                {savedWorks.length > 0 && (
                  <div className="mb-8 text-left bg-gray-50 p-4 rounded-xl border-2 border-gray-200">
                    <h3 className="font-bold text-gray-700 mb-3">📁 つくった スライド</h3>
                    <div className="space-y-3 max-h-60 overflow-y-auto pr-2 custom-scrollbar">
                      {savedWorks.map((work, idx) => (
                        <div key={idx} className="flex flex-col gap-2 bg-white p-3 rounded-lg shadow-sm border border-gray-100">
                          <span className="text-sm font-bold text-gray-600">{work.date} の作品 ({savedWorks.length - idx})</span>
                          <p className="text-sm font-note text-indigo-800 truncate">{work.sentence}</p>
                          <div className="flex gap-2">
                            <button onClick={() => { setViewingWork(work); setSlideFailCount(0); setLocalVoiceCleared(false); setPracticeIndex(0); setFeedbackMsg(""); goToStep('VIEW_SLIDESHOW'); }} className="text-sm bg-indigo-100 hover:bg-indigo-200 text-indigo-800 font-bold py-2 px-3 rounded shadow-sm border border-indigo-300 flex-1">▶️ スライドを見る</button>
                            <button onClick={() => { setViewingWork(work); goToStep('IMAGE_INPUT'); }} className="text-sm bg-yellow-100 hover:bg-yellow-200 text-yellow-800 font-bold py-2 px-3 rounded shadow-sm border border-yellow-300 flex-1">✏️ 修正</button>
                          </div>
                        </div>
                      ))}
                    </div>
                  </div>
                )}
                
                <button onClick={() => { 
                    setInputs(JSON.parse(JSON.stringify(INITIAL_INPUTS))); 
                    goToStep('INPUT'); 
                  }} 
                  className="w-full bg-red-500 hover:bg-red-600 text-white text-2xl font-bold py-6 rounded-2xl shadow-lg transform transition hover:scale-105 mb-8">
                  ▶ あたらしく つくる！
                </button>
                
                <div className="border-t-4 border-dashed border-gray-200 pt-6">
                  <div className="flex justify-between items-center mb-4">
                    <h2 className="text-xl font-bold text-gray-700">🐶 キャラクターの おせわ</h2>
                    <div className="bg-yellow-100 text-yellow-800 font-bold px-4 py-1 rounded-full border-2 border-yellow-300">🪙 {totalCoins} コイン</div>
                  </div>
                  
                  <div className="bg-indigo-50 p-6 rounded-2xl border-2 border-indigo-100 flex flex-col items-center relative mb-6">
                    <div className="text-7xl mb-2 drop-shadow-md">{currentStage.emoji}</div>
                    <div className="font-bold text-indigo-800 mb-2 text-xl">{currentStage.name} (Lv.{level})</div>
                    <div className="w-full bg-gray-200 rounded-full h-4 mb-2 overflow-hidden border border-gray-300">
                      <div className="bg-blue-500 h-4 rounded-full transition-all duration-500" style={{ width: nextReq === 'MAX' ? '100%' : `${(exp / nextReq) * 100}%` }}></div>
                    </div>
                    <div className="text-xs font-bold text-gray-500 mb-4">EXP: {exp} / {nextReq}</div>
                    
                    <div className="flex gap-2 w-full">
                      {Object.keys(SALMON_TYPES).map(key => {
                        const type = SALMON_TYPES[key];
                        const count = items[key] || 0;
                        return (
                          <button key={key} onClick={() => feedInnuuni(key)} disabled={count === 0} className={`flex-1 py-2 rounded-xl font-bold shadow-sm text-sm border-2 ${count > 0 ? 'bg-white border-blue-300 hover:bg-blue-50' : 'bg-gray-100 border-gray-200 text-gray-400 cursor-not-allowed'} flex flex-col items-center`}>
                            <span className="text-xl">{type.emoji}</span>
                            <span>{count}個</span>
                          </button>
                        );
                      })}
                    </div>
                    {feedbackMsg && <p className="text-blue-600 font-bold mt-2 animate-bounce">{feedbackMsg}</p>}
                    
                    {helpers.length > 0 && (
                      <div className="mt-4 p-3 bg-white rounded-xl border border-indigo-200 w-full text-left">
                        <p className="text-xs font-bold text-indigo-500 mb-1 flex items-center gap-1"><span>🤝</span> お助けキャラ (ゲームを手伝ってくれるよ！)</p>
                        <div className="flex flex-wrap gap-1">
                          {helpers.map(h => (
                            <span key={h.id} className="text-lg bg-gray-50 p-1 rounded-md border border-gray-100 shadow-sm" title={h.name}>{h.emoji}</span>
                          ))}
                        </div>
                      </div>
                    )}
                  </div>

                  <div className="flex gap-4 flex-wrap">
                    <button onClick={() => goToStep('GAME_INTRO')} disabled={!canPlayGame} className={`flex-1 min-w-[150px] font-bold py-4 rounded-xl shadow-md transition text-lg ${canPlayGame ? 'bg-green-500 hover:bg-green-600 text-white' : 'bg-gray-300 text-gray-500 cursor-not-allowed'}`}>
                      🎮 ゲームで<br/>コインを集める
                      {!canPlayGame && <span className="block text-xs mt-1 text-red-500 font-bold">※新しい文章を作ってね</span>}
                    </button>
                    <button onClick={startGacha} disabled={totalCoins < 5} className={`flex-1 min-w-[150px] font-bold py-4 rounded-xl shadow-md transition text-lg ${totalCoins >= 5 ? 'bg-yellow-400 hover:bg-yellow-500 text-yellow-900' : 'bg-gray-300 text-gray-500 cursor-not-allowed'}`}>
                      🎁 ガチャをする<br/><span className="text-sm font-normal">(5コイン)</span>
                    </button>
                  </div>
                </div>
              </div>
            </div>

            {gachaState && (
              <div className="fixed inset-0 bg-black/80 flex items-center justify-center z-50 p-4">
                <div className="bg-white rounded-3xl p-8 max-w-md w-full text-center shadow-2xl relative border-8 border-yellow-400">
                  {gachaState.phase === 'quiz' && (
                    <div className="animate-fade-in-up">
                      <h3 className="text-2xl font-bold text-blue-700 mb-2">英単語クイズ！</h3>
                      <p className="text-gray-600 font-bold mb-6">正解するまで何度でも挑戦できるよ！</p>
                      
                      <div className="text-3xl font-bold text-gray-800 mb-4 bg-gray-100 py-4 rounded-xl border-2 border-gray-200 flex items-center justify-center gap-4">
                        {gachaTargetRef.current.ja}
                        <button onClick={() => speak(gachaTargetRef.current.en)} className="bg-blue-100 p-2 rounded-full text-xl shadow-sm border border-blue-200">🔊</button>
                      </div>

                      <div className="grid grid-cols-1 gap-3">
                        {quizOptions.map((opt, i) => (
                          <button key={i} onClick={() => handleQuizAnswer(opt)} className="bg-white hover:bg-blue-50 border-2 border-blue-300 text-blue-800 font-bold text-xl py-3 rounded-xl shadow-sm font-note">
                            {opt.en}
                          </button>
                        ))}
                      </div>
                      {feedbackMsg && <p className="text-red-500 font-bold mt-4 animate-shake">{feedbackMsg}</p>}
                    </div>
                  )}
                  {gachaState.phase === 'voice' && (
                    <div className="animate-fade-in-up">
                      <h3 className="text-2xl font-bold text-green-700 mb-2">大正解！🎉</h3>
                      <p className="text-gray-600 font-bold mb-6">マイクで正しく発音できたら<span className="text-red-500">ボーナスガチャ</span>！</p>
                      
                      <div className="text-4xl font-bold text-gray-800 mb-6 font-note flex items-center justify-center gap-4">
                        {gachaTargetRef.current.en}
                        <button onClick={() => speak(gachaTargetRef.current.en)} className="bg-blue-100 p-2 rounded-full text-xl shadow-sm border border-blue-200">🔊</button>
                      </div>
                      
                      <button onClick={() => startListening(
                        gachaTargetRef.current.en, 
                        () => rollGacha(true, false),
                        () => setGachaFailCount(prev => prev + 1)
                      )} disabled={isListening} className={`w-20 h-20 rounded-full shadow-lg text-3xl mb-4 ${isListening ? 'bg-red-500 animate-pulse' : 'bg-teal-500 hover:bg-teal-600'} text-white transition`}>🎤</button>
                      
                      {gachaFailCount >= 3 && (
                        <div className="mb-4">
                          <button onClick={() => rollGacha(true, false)} className="bg-green-500 hover:bg-green-600 text-white px-6 py-2 rounded-full font-bold shadow-md animate-bounce">
                            🌟 特別クリア
                          </button>
                        </div>
                      )}

                      <p className="font-bold text-gray-600 mb-4">{isListening ? "はなしてね..." : "マイクをおして発音！"}</p>
                      {feedbackMsg && <p className="text-blue-600 font-bold mb-4">{feedbackMsg}</p>}

                      <button onClick={() => setGachaState(null)} className="text-gray-500 underline font-bold mt-4 block w-full bg-gray-100 py-2 rounded-lg hover:bg-gray-200">スキップしてボーナスを諦める</button>
                    </div>
                  )}
                  {gachaState.phase === 'animation' && (
                    <div className="animate-pulse flex flex-col items-center justify-center py-8">
                      <div className="text-8xl mb-6 animate-bounce">🎁</div>
                      <h3 className="text-3xl font-bold text-yellow-600 mb-2">ガチャを引いています...</h3>
                      <p className="text-gray-500 font-bold">何が出るかな？</p>
                    </div>
                  )}
                  {gachaState.phase === 'result' && (
                    <div className="animate-bounce-in">
                      <h3 className="text-3xl font-bold text-yellow-600 mb-6">ガチャ結果！</h3>
                      <div className="text-8xl mb-6">{gachaState.item.emoji}</div>
                      <p className="text-2xl font-bold text-gray-800 mb-2">{gachaState.item.name}</p>
                      <p className="text-sm font-bold text-blue-600 mb-8">EXP +{gachaState.item.exp}</p>
                      
                      {gachaState.hasNextBonus ? (
                        <button onClick={() => setGachaState(prev => ({ ...prev, phase: 'quiz' }))} className="w-full bg-green-500 hover:bg-green-600 text-white font-bold py-4 rounded-xl text-lg shadow-md animate-pulse">
                          🎁 クイズに答えてボーナスガチャを引く！
                        </button>
                      ) : (
                        <button onClick={() => setGachaState(null)} className="w-full bg-blue-500 hover:bg-blue-600 text-white font-bold py-4 rounded-xl text-xl shadow-md">もどる</button>
                      )}
                    </div>
                  )}
                </div>
              </div>
            )}
          </div>
        );
      } 
      else if (step === 'INPUT') {
        content = (
          <div className="min-h-screen p-4 flex flex-col items-center py-12 relative bg-indigo-50">
            <BackButton />
            <HomeButton />
            <div className="w-full max-w-xl text-center pb-24 mt-8">
              <h2 className="text-2xl font-bold text-indigo-700 mb-6 bg-white py-3 px-4 rounded-full border-4 border-indigo-200 shadow-sm">食べ物と ねだんを きめよう！</h2>
              
              <div className="bg-white p-6 rounded-2xl mb-6 border-4 border-indigo-100 shadow-md text-left">
                {inputs.map((inp, idx) => (
                  <div key={idx} className="mb-6 border-b-2 border-dashed border-gray-200 pb-6 last:border-0 last:pb-0">
                    <h3 className="font-bold text-gray-700 mb-2 flex items-center">✨ {idx + 1}. {inp.label} {inp.example && <span className="ml-2 text-xs font-normal text-gray-400">例: {inp.example}</span>}</h3>
                    
                    <div className="flex items-center gap-3 mb-3">
                      <button onClick={() => {
                        if (!SpeechRecognition) {
                          alert("マイクが使えません。");
                          return;
                        }
                        const recognition = new SpeechRecognition();
                        recognition.lang = 'ja-JP';
                        setListeningIdx(idx);
                        recognition.onresult = (event) => {
                          const trans = event.results[0][0].transcript;
                          const newInputs = [...inputs];
                          newInputs[idx].action = trans;
                          setInputs(newInputs);
                        };
                        recognition.onend = () => setListeningIdx(null);
                        recognition.start();
                      }} className={`shrink-0 w-14 h-14 rounded-full shadow-md text-2xl flex items-center justify-center transition ${listeningIdx === idx ? 'bg-red-500 text-white animate-pulse' : 'bg-blue-100 text-blue-600 hover:bg-blue-200'}`}>🎤</button>
                      
                      <input type="text" value={inp.action || ''} onChange={e => {
                        const newInputs = [...inputs];
                        newInputs[idx].action = e.target.value;
                        setInputs(newInputs);
                      }} className="flex-1 p-3 border-2 border-indigo-200 rounded-xl font-bold text-xl focus:outline-none focus:border-indigo-400 bg-indigo-50 min-h-[56px] text-gray-700" placeholder="食べ物を日本語で入力" />
                    </div>

                    <div className="flex items-center gap-3">
                      <span className="font-bold text-gray-600 text-sm whitespace-nowrap">💰 ねだん：</span>
                      <select
                        value={inp.price}
                        onChange={e => {
                          const newInputs = [...inputs];
                          newInputs[idx].price = e.target.value;
                          setInputs(newInputs);
                        }}
                        className="flex-1 p-3 border-2 border-yellow-300 rounded-xl font-bold text-xl focus:outline-none focus:border-yellow-500 bg-yellow-50 text-gray-800"
                      >
                        <option value="">ねだんをえらんでね（50〜950円）</option>
                        {PRICE_OPTIONS.map(p => (
                          <option key={p} value={p}>{p} 円</option>
                        ))}
                      </select>
                    </div>
                  </div>
                ))}
                
                {translatingState ? (
                  <div className="bg-blue-50 p-4 rounded-xl border-2 border-blue-200 mt-4 text-center animate-pulse">
                    <p className="text-blue-700 font-bold text-lg">⏳ ほんやく中...</p>
                  </div>
                ) : (
                  <>
                    <div className="bg-yellow-50 p-4 rounded-xl border-2 border-yellow-200 mt-4 text-left">
                      <p className="text-sm font-bold text-gray-700">⚠️ おねがい</p>
                      <ul className="text-xs font-bold text-gray-600 list-disc ml-5 mt-1">
                        <li>3つのわくに「同じ食べ物」を2つ以上いれることはできません。</li>
                        <li>ねだんは 50〜950円の 50の倍数からえらんでね。</li>
                        <li>前に作ったスライドと「まったく同じ組み合わせ」は作れません。</li>
                      </ul>
                    </div>
                    <button onClick={handleTranslateAll} disabled={!isAllInputsFilled} className={`w-full mt-4 text-xl font-bold py-5 rounded-xl shadow-md transition transform ${isAllInputsFilled ? 'bg-indigo-500 hover:bg-indigo-600 text-white hover:-translate-y-1' : 'bg-gray-400 text-gray-200 cursor-not-allowed'}`}>
                      えいごの文にする！
                    </button>
                  </>
                )}
                {!isAllInputsFilled && <p className="text-center text-sm text-red-500 font-bold mt-3">※3つの食べ物とねだんをすべて入力してね！</p>}
              </div>
            </div>
          </div>
        );
      }
      else if (step === 'NOTE_WRITE') {
        const menuItems = viewingWork.menuItems || [];
        content = (
          <div className="min-h-screen bg-yellow-50 p-4 flex flex-col items-center py-12 relative">
            <BackButton />
            <HomeButton />
            <div className="w-full max-w-4xl bg-white p-4 md:p-8 rounded-3xl shadow-xl border-4 border-yellow-300 mb-20 mt-12">
              <h2 className="text-3xl font-bold text-yellow-700 mb-4 text-center">📝 ノートに 書きうつそう！</h2>
              <p className="text-center font-bold text-gray-600 mb-6">「How much is it?」と聞かれたときの 店員さんの答えを ノートに書いてね。<br/>書きおわったら、先生に チェックしてもらおう！</p>
              
              <div className="bg-white border-2 border-gray-300 p-4 md:p-8 rounded-xl shadow-inner mb-8 space-y-6 bg-[url('https://www.transparenttextures.com/patterns/lined-paper-2.png')]">
                {menuItems.map((item, idx) => (
                  <div key={idx} className="text-left w-full overflow-x-auto pb-2 custom-scrollbar">
                    <div className="text-sm font-bold text-indigo-700 mb-1">
                      {idx + 1}. {item.ja} ({item.en})
                    </div>
                    <div className="min-w-max">
                      <div className="four-lines-bg rounded-lg border-2 border-gray-200 shadow-sm flex min-w-max bg-white/80">
                        <span className="font-note font-bold px-4 text-gray-800 flex items-baseline flex-nowrap">
                          {item.sentence}
                        </span>
                      </div>
                    </div>
                  </div>
                ))}
              </div>
              
              <button onClick={() => goToStep('TEACHER_CHECK')} className="w-full bg-red-500 hover:bg-red-600 text-white text-xl font-bold py-5 rounded-2xl shadow-lg animate-pulse">
                🙋 先生をよぶ（チェックがめんへ）
              </button>
            </div>
          </div>
        );
      }
      else if (step === 'TEACHER_CHECK') {
        const menuItems = viewingWork.menuItems || [];
        content = (
          <div className="min-h-screen bg-gray-200 p-4 flex flex-col items-center py-12 relative">
            <BackButton />
            <HomeButton />
            <div className="w-full max-w-3xl bg-white p-4 md:p-8 rounded-3xl shadow-2xl border-8 border-gray-400 relative mt-12">
              <div className="absolute -top-6 left-1/2 transform -translate-x-1/2 bg-gray-600 text-white px-8 py-2 rounded-full font-bold text-xl shadow-md tracking-wider">先生専用 修正画面</div>
              <p className="text-center font-bold text-gray-700 mt-6 mb-6">児童のノートを確認し、必要であれば以下の英文を手直ししてください。<br/>修正内容はスライドに反映されます。</p>
              
              <div className="space-y-4 mb-8">
                {menuItems.map((item, idx) => (
                  <div key={idx} className="bg-gray-100 p-4 rounded-xl border border-gray-200">
                    <label className="block text-sm font-bold text-teal-700 mb-2">
                      {idx + 1}. {item.ja}（英語名・答える文）
                    </label>
                    <div className="flex flex-col md:flex-row gap-3">
                      <input 
                        type="text" 
                        value={item.en} 
                        onChange={e => {
                          const updated = [...menuItems];
                          updated[idx] = { ...updated[idx], en: e.target.value };
                          const combined = updated.map(m => `${m.en}: ${m.sentence}`).join(' / ');
                          setViewingWork({ ...viewingWork, menuItems: updated, sentence: combined });
                        }}
                        className="p-2 border-2 border-gray-300 rounded-lg font-note text-xl text-gray-700 bg-white md:w-1/3"
                        placeholder="英語の食べ物名"
                      />
                      <input 
                        type="text" 
                        value={item.sentence} 
                        onChange={e => {
                          const updated = [...menuItems];
                          updated[idx] = { ...updated[idx], sentence: e.target.value };
                          const combined = updated.map(m => `${m.en}: ${m.sentence}`).join(' / ');
                          setViewingWork({ ...viewingWork, menuItems: updated, sentence: combined });
                        }}
                        className="p-2 border-2 border-teal-400 rounded-lg font-note text-xl text-teal-700 bg-white flex-1"
                        placeholder="It's 500 yen."
                      />
                    </div>
                  </div>
                ))}
              </div>
              
              <button onClick={() => {
                markFirstDone();
                goToStep('IMAGE_INPUT');
              }} className="w-full bg-green-500 text-white text-xl font-bold py-5 rounded-2xl shadow-lg hover:bg-green-600 transition">
                ✅ チェック完了（画像さがしへすすむ）
              </button>
            </div>
          </div>
        );
      }
      else if (step === 'IMAGE_INPUT') {
        const canProceed = viewingWork && 
                           viewingWork.img1 && viewingWork.img1.trim() !== "" &&
                           viewingWork.img2 && viewingWork.img2.trim() !== "" &&
                           viewingWork.img3 && viewingWork.img3.trim() !== "";
        
        const menuItems = viewingWork.menuItems || [];
        let keyword1 = menuItems[0]?.ja || viewingWork?.inputs?.[0]?.action || 'Japan Food';
        let keyword2 = menuItems[1]?.ja || viewingWork?.inputs?.[1]?.action || 'Japan Food';
        let keyword3 = menuItems[2]?.ja || viewingWork?.inputs?.[2]?.action || 'Japan Food';
        
        content = (
          <div className="min-h-screen p-4 flex flex-col items-center py-12 relative bg-indigo-50">
            <BackButton />
            <HomeButton />
            <div className="w-full max-w-2xl bg-white p-6 md:p-8 rounded-3xl shadow-xl border-4 border-indigo-200 mt-12">
              <h2 className="text-2xl font-bold text-indigo-700 mb-6 text-center">スライドの文章を かくにん・修正しよう✍️</h2>
              
              <div className="bg-gray-50 p-4 rounded-2xl border-2 border-gray-200 shadow-inner mb-8 space-y-4">
                {menuItems.map((item, idx) => (
                  <div key={idx} className="bg-white p-3 rounded-xl border border-indigo-100">
                    <div className="text-xs font-bold text-gray-500 mb-1">{idx + 1}. {item.ja} ({item.en})</div>
                    <div className="flex items-center gap-2">
                      <input 
                        type="text" 
                        value={item.sentence} 
                        onChange={e => {
                          const updated = [...menuItems];
                          updated[idx] = { ...updated[idx], sentence: e.target.value };
                          const combined = updated.map(m => `${m.en}: ${m.sentence}`).join(' / ');
                          setViewingWork({ ...viewingWork, menuItems: updated, sentence: combined });
                        }}
                        className="flex-1 p-2 border-2 border-indigo-200 rounded-lg font-note text-xl text-gray-800 focus:outline-none focus:border-indigo-400"
                      />
                      <button onClick={() => speak(item.sentence)} className="bg-blue-100 hover:bg-blue-200 text-blue-700 font-bold py-2 px-3 rounded-lg shadow-sm border border-blue-300">🔊</button>
                    </div>
                  </div>
                ))}
              </div>

              <h2 className="text-2xl font-bold text-indigo-700 mb-6 text-center">スライドの がぞうを さがそう🖼️</h2>
              
              <div className="space-y-6">
                {[
                  { key: 'img1', keyword: keyword1, label: '１つめ' },
                  { key: 'img2', keyword: keyword2, label: '２つめ' },
                  { key: 'img3', keyword: keyword3, label: '３つめ' }
                ].map((item, idx) => (
                  <div key={idx} className="bg-gray-50 p-4 rounded-xl border-2 border-gray-200 shadow-sm">
                    <h3 className="font-bold text-indigo-800 mb-2">{item.label}の食べ物: {item.keyword}</h3>
                    <a href={`https://www.google.com/search?tbm=isch&q=${encodeURIComponent(item.keyword)}`} target="_blank" rel="noopener noreferrer" className="inline-block mb-4 bg-indigo-100 hover:bg-indigo-200 text-indigo-800 font-bold py-2 px-4 rounded-xl shadow-sm border border-indigo-300 transition-colors w-full text-center">
                      🔍 「{item.keyword}」で 画像けんさく
                    </a>

                    <label className="block text-sm font-bold text-gray-600 mb-2">画像アドレスをはりつけ</label>
                    <input type="text" value={viewingWork[item.key] || ''} onChange={e => {
                      setViewingWork({...viewingWork, [item.key]: e.target.value});
                    }} placeholder="https://..." className="w-full p-4 border-2 border-gray-300 rounded-xl text-sm font-bold focus:outline-none focus:border-indigo-500 bg-white mb-4" />
                    
                    {viewingWork[item.key] && (
                      <div className="relative flex justify-center">
                        <img src={viewingWork[item.key]} alt={`preview ${idx}`} onError={(e) => {e.target.style.display='none'; e.target.parentElement.innerHTML = '<div class="text-red-500 font-bold bg-red-50 p-3 rounded-lg border-2 border-red-200 text-sm">画像が読み込めません💦 別のアドレスをためしてね！</div>';}} className="h-32 object-cover rounded-lg shadow-md border-2 border-gray-300" />
                      </div>
                    )}
                  </div>
                ))}
              </div>
              
              <button onClick={() => { 
                  if (canProceed) {
                    const isExisting = savedWorks.some(w => w.date === viewingWork.date);
                    if (isExisting) {
                      updateWork(viewingWork.date, viewingWork);
                    } else {
                      saveWork(viewingWork);
                    }
                    setSlideFailCount(0);
                    setLocalVoiceCleared(false);
                    setPracticeIndex(0);
                    setFeedbackMsg("");
                    goToStep('VIEW_SLIDESHOW'); 
                  } else {
                    alert("3つすべての画像アドレスを入れてね！");
                  }
                }} 
                className={`w-full mt-8 text-white text-xl font-bold py-5 rounded-2xl shadow-lg transition transform ${canProceed ? 'bg-blue-500 hover:bg-blue-600 hover:-translate-y-1' : 'bg-gray-400 cursor-not-allowed'}`}>
                スライド完成！ 見てみよう ▶
              </button>
            </div>
          </div>
        );
      }
      else if (step === 'VIEW_SLIDESHOW') {
        const toggleFullscreen = () => {
          const elem = document.getElementById('slide-fullscreen-container');
          if (!elem) return;
          if (!document.fullscreenElement) {
            elem.requestFullscreen().catch(() => {});
          } else {
            document.exitFullscreen();
          }
        };

        const menuItems = viewingWork.menuItems || [
          { ja: '1つめ', en: 'item 1', sentence: viewingWork.sentence }
        ];
        const currentItem = menuItems[practiceIndex] || menuItems[0];
        const targetSentence = currentItem ? currentItem.sentence : '';

        content = (
          <div id="slide-fullscreen-container" className="fixed inset-0 bg-black flex flex-col z-50">
            <div className="flex-1 flex items-center justify-center p-2 md:p-8">
              <div className="w-full h-full max-h-[90vh] max-w-5xl slide-bg rounded-xl md:rounded-3xl shadow-[0_0_50px_rgba(255,255,255,0.2)] overflow-hidden relative flex flex-col border-4 border-gray-800">
                
                <button onClick={toggleFullscreen} className="absolute top-4 right-20 bg-gray-800/80 text-white w-12 h-12 rounded-full flex items-center justify-center text-xl shadow-lg z-20 hover:bg-gray-700 border border-gray-600 backdrop-blur" title="全画面表示">⛶</button>
                <button onClick={() => speak(targetSentence)} className="absolute top-4 right-4 bg-indigo-500 text-white w-12 h-12 rounded-full flex items-center justify-center text-2xl shadow-lg z-20 hover:bg-indigo-600 border-2 border-white">🔊</button>
                
                <button onClick={() => {
                  if (document.fullscreenElement) document.exitFullscreen(); 
                  goToStep('IMAGE_INPUT');
                }} className="absolute top-20 right-4 bg-yellow-500 text-white px-4 py-2 rounded-full font-bold z-20 shadow-lg hover:bg-yellow-600 border-2 border-white">
                  ✏️ 修正する
                </button>

                <div className="flex-1 min-h-0 w-full flex flex-col md:flex-row items-center justify-center bg-gray-900 relative gap-4 p-4 md:p-8">
                  {[viewingWork.img1, viewingWork.img2, viewingWork.img3].map((img, idx) => {
                    const item = menuItems[idx];
                    const isActive = !localVoiceCleared && idx === practiceIndex;
                    return img ? (
                      <div key={idx} className={`flex-1 w-full h-full flex flex-col items-center justify-center overflow-hidden rounded-xl p-2 transition-all duration-300 ${isActive ? 'ring-4 ring-yellow-400 bg-gray-800/80 scale-105' : 'opacity-70'}`}>
                        <img src={img} alt={`slide ${idx}`} className="max-w-full max-h-[75%] object-contain rounded-lg shadow-md border-2 border-gray-700" />
                        {item && (
                          <div className="mt-2 text-center">
                            <span className="text-white font-bold text-lg md:text-xl font-note">{item.en}</span>
                            <span className="ml-2 text-yellow-300 font-bold text-sm md:text-base">({item.price} yen)</span>
                          </div>
                        )}
                      </div>
                    ) : null;
                  })}
                  {(!viewingWork.img1 && !viewingWork.img2 && !viewingWork.img3) && (
                    <div className="text-gray-500 font-bold text-2xl">がぞう は ありません</div>
                  )}
                </div>
                
                <div className="shrink-0 w-full bg-black px-4 py-4 md:py-6 flex flex-col items-center justify-center text-center border-t-2 border-gray-800 min-h-[32vh]">
                  
                  {!localVoiceCleared ? (
                    <div className="bg-gray-800 p-4 rounded-xl border border-gray-600 w-full max-w-2xl">
                      <div className="flex flex-col items-center">
                        <p className="text-gray-300 font-bold mb-2 text-sm">
                          店員さんになって答えよう！ ({practiceIndex + 1}/{menuItems.length}： {currentItem?.ja})
                        </p>

                        {/* お客さんの質問 */}
                        <div className="flex items-center justify-center gap-2 mb-3 bg-indigo-900/60 px-4 py-2 rounded-full border border-indigo-400">
                          <span className="text-indigo-200 text-sm font-bold">お客さん：</span>
                          <span className="text-white font-note text-xl md:text-2xl font-bold">How much is it?</span>
                          <button onClick={() => speak("How much is it?")} className="bg-indigo-500 hover:bg-indigo-400 text-white w-8 h-8 rounded-full text-sm flex items-center justify-center shadow">🔊</button>
                        </div>
                        
                        {/* 店員さんの答え */}
                        <div className="mb-4 text-3xl md:text-4xl font-note leading-tight text-yellow-300 font-bold">
                          {targetSentence}
                        </div>

                        <div className="flex items-center justify-center gap-4 mb-2">
                          <button onClick={() => speak(targetSentence)} className="w-12 h-12 rounded-full bg-blue-500 hover:bg-blue-600 text-white text-xl shadow-lg border-2 border-blue-300 flex items-center justify-center" title="答えの音声を聞く">🔊</button>
                          
                          <button onClick={() => {
                            startListening(targetSentence, 
                             () => { 
                               if (practiceIndex < menuItems.length - 1) {
                                 setFeedbackMsg("Good! つぎの食べ物も答えてみよう！");
                                 setPracticeIndex(prev => prev + 1);
                               } else {
                                 setLocalVoiceCleared(true);
                                 if (!viewingWork.hasPlayedGame) {
                                   setFeedbackMsg("Great! 🎉 ゲームができるようになったよ！"); 
                                   setCanPlayGame(true); 
                                   updateWorkGameStatus(viewingWork.date);
                                 } else {
                                   setFeedbackMsg("Great! 🎉 (このスライドでのゲームはプレイ済みだよ)");
                                 }
                               }
                               setSlideFailCount(0); 
                             }, 
                             () => { setSlideFailCount(prev => prev + 1); }
                            );
                          }} disabled={isListening} className={`w-16 h-16 rounded-full shadow-lg text-2xl ${isListening ? 'bg-red-500 animate-pulse' : 'bg-teal-500 hover:bg-teal-600'} text-white transition flex items-center justify-center border-2 border-white`}>🎤</button>
                          
                          {slideFailCount >= 3 && (
                            <button onClick={() => { 
                              if (practiceIndex < menuItems.length - 1) {
                                setFeedbackMsg("3回がんばったね！ 次へ進もう！");
                                setPracticeIndex(prev => prev + 1);
                              } else {
                                setLocalVoiceCleared(true);
                                if (!viewingWork.hasPlayedGame) {
                                  setFeedbackMsg("3回がんばったね！ ゲームができるようになったよ！");
                                  setCanPlayGame(true); 
                                  updateWorkGameStatus(viewingWork.date);
                                } else {
                                  setFeedbackMsg("3回がんばったね！ (プレイ済み)");
                                }
                              }
                              setSlideFailCount(0);
                            }} className="text-sm bg-green-600 hover:bg-green-500 text-white px-4 py-2 rounded-full transition shadow border border-green-500">🌟 特別クリア</button>
                          )}
                        </div>
                        <p className="text-gray-300 font-bold text-xs">{isListening ? "はなしてね..." : "マイクで正しく答えられると、次へ進めるよ！"}</p>
                        {feedbackMsg && <p className={feedbackMsg.includes("エラー") || feedbackMsg.includes("おしい") || feedbackMsg.includes("マイクが") ? "text-yellow-400 font-bold mt-2 whitespace-pre-line text-sm" : "text-green-400 font-bold mt-2 text-sm"}>{feedbackMsg}</p>}
                      </div>
                    </div>
                  ) : (
                    <div className="animate-bounce-in w-full max-w-2xl">
                      <div className="flex flex-wrap justify-center gap-4 mb-4">
                        {menuItems.map((m, i) => (
                          <div key={i} className="bg-gray-800 px-4 py-2 rounded-xl border border-gray-600">
                            <span className="text-gray-300 text-sm block">{m.en}</span>
                            <span className="text-white text-xl md:text-2xl font-bold font-note">{m.sentence}</span>
                          </div>
                        ))}
                      </div>
                      <p className="text-green-400 font-bold text-xl mb-2 text-center">✨ 音声クリア！ ✨</p>
                      {feedbackMsg && <p className="text-sm text-yellow-300 font-bold mb-4 text-center">{feedbackMsg}</p>}
                      <button onClick={() => {
                         if (document.fullscreenElement) document.exitFullscreen(); 
                         setStep('HOME'); setStepHistory(['HOME']);
                      }} className="w-full max-w-md bg-red-500 hover:bg-red-600 text-white font-bold py-3 rounded-full text-lg shadow-md animate-pulse">
                        🙋 友だちにスライドを見せた！(ホームへ)
                      </button>
                    </div>
                  )}

                </div>
              </div>
            </div>
          </div>
        );
      }
      else if (step === 'GAME_INTRO') {
        content = (
          <div className="min-h-screen bg-gray-900 p-4 flex items-center justify-center relative">
            <BackButton />
            <HomeButton />
            <div className="max-w-lg w-full bg-gray-800 rounded-3xl shadow-xl p-8 text-center border-4 border-gray-600">
              <h2 className="text-3xl font-bold text-white mb-6">コインあつめゲーム！</h2>
              <div className="bg-gray-700 p-6 rounded-2xl mb-8 border border-gray-600">
                <div className="text-6xl mb-4 text-center flex justify-center gap-2">
                  <span>🪙</span><span className="animate-bounce">{currentStage.emoji}</span>
                </div>
                <p className="text-lg font-bold text-gray-200 leading-relaxed text-left">
                  <span className="text-teal-400">{currentStage.name}</span> をうごかして コインを集めよう！<br/><br/>
                  <span className="text-yellow-400">操作:</span> 矢印キー または W,A,S,D (画面のボタンも使えるよ)<br/>
                  <span className="text-red-400">注意:</span> 敵(👾インベーダー)にぶつかると しばらく動けなくなります。<br/><br/>
                  {helpers.length > 0 && <span className="block text-purple-400 text-sm mb-2 font-bold">✨ お助けキャラが敵を倒してくれます！ ✨</span>}
                  制限時間は <span className="text-white text-xl">15秒</span>！
                </p>
              </div>
              <button onClick={() => goToStep('GAME')} className="bg-blue-600 hover:bg-blue-500 text-white font-bold py-4 px-12 rounded-full text-2xl shadow-[0_0_15px_rgba(37,99,235,0.5)] w-full transition transform hover:scale-105 border-2 border-blue-400">スタート！</button>
            </div>
          </div>
        );
      }
      else if (step === 'GAME') {
         content = (
           <div className="fixed inset-0 bg-gray-900 flex flex-col touch-none overflow-hidden h-screen w-screen">
              <div className="absolute top-4 left-4 z-50">
                <button onClick={() => { setStep('HOME'); setStepHistory(['HOME']); }} className="bg-gray-800/80 text-white px-4 py-2 rounded-full font-bold border-2 border-white/50 backdrop-blur shadow-lg text-sm">
                  ◀ ホーム
                </button>
              </div>
              <ThreeCoinGame playerEmoji={currentStage.emoji} helpers={helpers} onFinish={(coins) => {
                saveProgress(totalCoins + coins, items, level, exp, helpers);
                setCanPlayGame(false); 
                setStep('HOME');
                setStepHistory(['HOME']);
              }} />
           </div>
         );
      }

      return (
        <div className={`relative ${step === 'GAME' ? 'h-screen w-screen overflow-hidden' : 'min-h-screen'}`}>
          {content}
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
